[project]
name = "echoview"
version = "0.0.0" # Fake version, version is set in version.xml file # TODO: Switch to tracking version dynamically
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "click>=8.4.0",
    "loguru>=0.7.3",
    "lxml>=6.1.0",
    "platformdirs>=4.9.6",
    "pyside6>=6.11.1",
]


[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.20.2",
    "pytest>=8.4.1",
    "ruff>=0.15.12",
]

build = [
    "nuitka>=4.1",
]

[tool.mypy]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
pretty = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ['venv', '.venv', 'submodules']

[[tool.mypy.overrides]]
module = ['pytestqt.qtbot', 'zstandard']
ignore_missing_imports = true

[tool.ruff]
# Defaults to Black like
line-length = 88
indent-width = 4
lint.extend-select = ["I"]
exclude = ["submodules"]
unfixable=["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = '.'
testpaths = ['tests']

# exclude submodules from test discovery
norecursedirs = ['submodules']

[tool.pyright]
pythonPlatform = "All"

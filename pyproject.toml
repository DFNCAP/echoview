[project]
name = "echoview"
#version = "0.0.0" # Fake version, version is set in version.xml file # TODO: Switch to tracking version dynamically
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "click>=8.4.0",
    "imagehash>=4.3.2",
    "loguru>=0.7.3",
    "lxml>=6.1.0",
    "platformdirs>=4.9.6",
    "psutil>=7.2.2",
    "pyside6>=6.11.1",
    "usb-monitor>=1.23",
]

[dependency-groups]
dev = [
    "imageio>=2.37.3",
    "lxml-stubs>=0.5.1",
    "pytest>=8.4.1",
    "ruff>=0.15.12",
    "dunamai>=1.26.1",
    "nuitka>=4.1",
    "pytest-qt>=4.5.0",
    "pytest-cov>=6.2.1",
    "basedpyright>=1.40.1",
]

[tool.mypy]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
pretty = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ['venv', '.venv', 'submodules']

[[tool.mypy.overrides]]
module = ['pytestqt.qtbot', 'zstandard']
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["arg-type", "attr-defined", "no-untyped-def", "var-annotated"]

[tool.ruff]
# Defaults to Black like
line-length = 120
indent-width = 4
lint.extend-select = ["I"]
lint.exclude = ["submodules"]
lint.unfixable=["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
]
pythonpath = "."
testpaths = ["tests"]
markers = [
    "integration: mocked multi-component integration tests",
]

# exclude submodules from test discovery
norecursedirs = ["submodules"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/_version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.pyright]
pythonPlatform = "All"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["app"]
